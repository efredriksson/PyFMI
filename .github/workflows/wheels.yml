name: Build wheels

on:
  push:
    branches: [master, main, beta]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish wheels to PyPI after building"
        type: boolean
        default: false
      test_release:
        description: "Publish under the pyfmi-testing PyPI name instead of PyFMI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.python }})
    # Skip `on: master` rows on PRs for fast feedback.
    if: matrix.on == 'all' || github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, python: cp311, on: all }
          - { arch: x86_64, runner: ubuntu-latest, python: cp312, on: master }
          - { arch: x86_64, runner: ubuntu-latest, python: cp313, on: master }

          # Blocked on assimulo upstream. To enable cp314: add "cp314-*"
          # to [tool.cibuildwheel].build in pyproject.toml.
          # - { arch: x86_64, runner: ubuntu-latest, python: cp314, on: all }
          # - { arch: x86_64, runner: ubuntu-latest, python: cp314, on: master }
          #
          # Blocked on assimulo-testing aarch64 wheel. To enable: add
          # `ARG ARCH=x86_64` to Dockerfile.manylinux and pass
          # `--build-arg ARCH=${{ matrix.arch }}` in the docker build step.
          # - { arch: aarch64, runner: ubuntu-24.04-arm, python: cp311, on: master }
          # - { arch: aarch64, runner: ubuntu-24.04-arm, python: cp312, on: master }
          # - { arch: aarch64, runner: ubuntu-24.04-arm, python: cp313, on: master }
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite package name to pyfmi-testing
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.test_release
        run: |
          sed -i 's/^name = "PyFMI"$/name = "pyfmi-testing"/' pyproject.toml
          sed -i "s/^  'PyFMI',$/  'pyfmi-testing',/" meson.build
          grep '^name = ' pyproject.toml
          grep -n "pyfmi-testing" meson.build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cibuildwheel

      - name: Build manylinux image (FMIL pre-installed)
        run: docker build -f Dockerfile.manylinux -t pyfmi-manylinux .

      - name: Build wheel
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
        run: cibuildwheel --platform linux --output-dir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}-${{ matrix.python }}
          path: dist/*.whl

  windows:
    name: Windows ${{ matrix.arch }} (${{ matrix.python }})
    # Skip `on: master` rows on PRs for fast feedback.
    if: matrix.on == 'all' || github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, python: cp311, on: all }
          - { arch: amd64, python: cp312, on: master }
          - { arch: amd64, python: cp313, on: master }

          # Blocked on assimulo upstream. To enable cp314: add "cp314-*"
          # to [tool.cibuildwheel].build in pyproject.toml.
          # - { arch: amd64, python: cp314, on: all }
          # - { arch: amd64, python: cp314, on: master }
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite package name to pyfmi-testing
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.test_release
        shell: bash
        run: |
          sed -i 's/^name = "PyFMI"$/name = "pyfmi-testing"/' pyproject.toml
          sed -i "s/^  'PyFMI',$/  'pyfmi-testing',/" meson.build
          grep '^name = ' pyproject.toml
          grep -n "pyfmi-testing" meson.build

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Build FMI Library
        shell: msys2 {0}
        run: bash tools/wheels/build_dependencies_windows.sh

      # MSYS2 setup-action only exports PATH/compiler vars to its own shell;
      # cibuildwheel runs under a fresh pwsh and needs them re-exported.
      - name: Configure compiler environment
        shell: pwsh
        run: |
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "C:\deps\bin"          | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "CC=gcc"               | Out-File -FilePath $env:GITHUB_ENV  -Append
          echo "CXX=g++"              | Out-File -FilePath $env:GITHUB_ENV  -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cibuildwheel
        shell: pwsh

      - name: Build wheel
        shell: pwsh
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
        run: cibuildwheel --platform windows --output-dir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.arch }}-${{ matrix.python }}
          path: dist/*.whl

  upload_pypi:
    name: Upload to PyPI
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/PyFMI
    permissions:
      id-token: write  # required for OIDC Trusted Publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
